name: build-demo

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "lab/scripts/*.py"
      - ".github/workflows/build-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage lab scripts into docker context
        run: |
          mkdir -p demo/lab-scripts
          cp lab/scripts/*.py demo/lab-scripts/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: demo
          push: true
          tags: |
            ghcr.io/fondation-io/qwen38-demo:latest
            ghcr.io/fondation-io/qwen38-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
